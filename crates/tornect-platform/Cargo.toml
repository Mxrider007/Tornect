[package]
name = "tornect-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
description = "OS session services for Tornect: the owner-only IPC endpoint, OS re-authentication and start at login (docs/PLAN.md §B.8.7.4, §B.8.7.5, §B.8.8)."

[lints]
workspace = true

[dependencies]
tornect-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
sha2.workspace = true
data-encoding.workspace = true
fs-err.workspace = true
getrandom.workspace = true
serde.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
# The panic key's GlobalShortcuts portal (§B.8.7.4).
ashpd.workspace = true
# `open(O_NOFOLLOW | O_NONBLOCK)` for the `mimeapps.list` edit of `tornect install`
# (design `invite` §4.5): the workspace's pin, with `fs`, which the app's tree
# already enables (calloop, polling, tempfile, wayland-backend, x11rb).
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
