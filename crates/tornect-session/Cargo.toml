[package]
name = "tornect-session"
description = "Tornect session orchestration: host and client state machines wiring signaling, connectivity and media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tornect-core.workspace = true
tornect-signal.workspace = true
tornect-net.workspace = true
tornect-proto.workspace = true
tornect-capture.workspace = true
tornect-codec.workspace = true
tornect-audio.workspace = true
tornect-input.workspace = true
sha2.workspace = true
# The viewer compares the direct path's `BindProof` in constant time (design
# `direct` §6.6, step A15).
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# `start_paused` for the bind-deadline tests.
tokio = { workspace = true, features = ["test-util"] }
# MemNet direct links for the direct bind's crypto-close test (design
# `direct` §12.1, step A15).
tornect-net = { workspace = true, features = ["test-support"] }
# The redaction e2e forces quinn-udp's own `sendmsg` warning through a raw
# `UdpSocketState::send`, which Tornect's sockets never call (design
# `direct` §12.4, step A22); tests only.
quinn.workspace = true

[lints]
workspace = true
