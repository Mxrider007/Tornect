[package]
name = "tornect-net"
description = "Tornect connectivity: candidate gathering, UPnP/NAT-PMP/PCP, STUN, hole punching, key-pinned QUIC, Tor-tunnel fallback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tornect-core.workspace = true
# Direct connections, Phase A (design `direct` §10, decision M1-81;
# docs/DEPENDENCIES.md has the rows): netdev reads the interface list and
# socket2 the route sources (step A7); quinn and the session socket follow
# (steps A8, A9).
quinn.workspace = true
netdev.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
# The pinned QUIC (step A9): constant-time pin comparisons, the exported
# binding secret wiped on drop.
subtle.workspace = true
zeroize.workspace = true
# The punch probe (step A10): the probe key derived from the session token
# (HKDF-SHA256), the HMAC-SHA256 tag, random txids, leads and padding.
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
sha2.workspace = true
# Router port mapping, Phase B (design `direct` §7.4, steps B4 and B5;
# docs/research/nat-traversal.md §3 and §4): PCP and NAT-PMP through crab_nat,
# UPnP-IGD through igd-next (`aio_tokio` only).
crab_nat.workspace = true
igd-next.workspace = true

# The default gateway of the route-source interface (design `direct` §7.1):
# netdev's `gateway` feature reads it from the kernel's tables on Linux
# (netlink) and macOS (a routing sysctl) and sends nothing. On Windows the same
# feature may call `SendARP`, so it is never compiled there: the app hands
# `tornect_platform::route::default_gateway_v4` (`GetBestRoute2`) to `RealNet`
# instead. docs/research/nat-traversal.md §1.6 and §5.
[target.'cfg(not(windows))'.dependencies]
netdev = { workspace = true, features = ["gateway"] }

[features]
# The in-memory and loopback test environments (`mem`) for other crates'
# tests: only dev-dependencies enable it. `cargo xtask dist` is to refuse a
# release graph that carries it (design `direct` §8.8; the check lands at
# step A22).
test-support = []

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# The quiet socket's tests capture every event its sends could emit.
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
