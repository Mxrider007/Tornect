[package]
name = "tornect-proto"
description = "Tornect media wire protocol: the Tor media stream framing and bind (slice), later packetizer, FEC, jitter buffer, pacer, ABR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hkdf.workspace = true
hmac.workspace = true
# CBOR bodies of the services stream (`services`), as `tornect-signal`'s messages.
minicbor.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
zeroize.workspace = true

[dev-dependencies]
# Property tests of the wire format (decode never panics; valid messages round-trip).
proptest.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }

[lints]
workspace = true
