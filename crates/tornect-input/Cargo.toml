[package]
name = "tornect-input"
description = "Tornect input: the 16-byte event, the USB HID key table, and host-side injection (XTEST, SendInput; portal in tornect-capture)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The clipboard fingerprint (`clipboard::fingerprint`).
sha2.workspace = true
thiserror.workspace = true
# `sync::watch` only: the channels of a `clipboard::ClipboardLink`.
tokio.workspace = true
tracing.workspace = true
# `clipboard::ClipText` wipes the text it holds.
zeroize.workspace = true

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
# The host's clipboard on X11 and Windows (`clipboard::arboard_link`).
arboard.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
