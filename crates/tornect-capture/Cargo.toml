[package]
name = "tornect-capture"
description = "Tornect screen capture: the VideoSource trait, a synthetic test card, and the X11, Wayland (RemoteDesktop portal + PipeWire) and GDI backends (later WGC, ScreenCaptureKit)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tornect-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
# Wayland (docs/research/slice.md §4): the RemoteDesktop + ScreenCast portal
# over zbus (ashpd, driven on a tokio runtime of its own), PipeWire through
# dlopen (libloading; no headers or libclang needed), and the input event the
# portal session injects (the portal session is shared by capture and input).
ashpd.workspace = true
libloading.workspace = true
tokio.workspace = true
futures.workspace = true
tornect-input.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The test card's index is read back from scaled, encoded and decoded pictures
# (synthetic.rs; quality design §8). A sibling crate, never a normal dependency.
tornect-codec.workspace = true
# `start_paused` for the portal's timeout tests (wayland/mod.rs, wayland/portal.rs):
# without it `cargo test -p tornect-capture` alone does not compile, since only a
# workspace build unifies the feature in from another crate's dev-dependencies.
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
# Windows: Windows.Graphics.Capture
wgc = []
# macOS: ScreenCaptureKit
sckit = []

[lints]
workspace = true
