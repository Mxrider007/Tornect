[package]
name = "tornect-capture"
description = "Tornect screen capture: the VideoSource trait, a synthetic test card, and the X11, GDI (and later PipeWire, WGC, ScreenCaptureKit) backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tornect-core.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[features]
default = []
# Linux/Wayland: xdg-desktop-portal ScreenCast → PipeWire (needs libpipewire-0.3-dev + libclang; CI-verified)
pipewire = []
# Windows: Windows.Graphics.Capture
wgc = []
# macOS: ScreenCaptureKit
sckit = []

[lints]
workspace = true
