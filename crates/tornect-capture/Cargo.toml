[package]
name = "tornect-capture"
description = "Tornect screen capture: VideoCaptureSource trait with Windows.Graphics.Capture, ScreenCaptureKit and PipeWire backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tornect-core.workspace = true

[features]
default = []
# Linux/Wayland: xdg-desktop-portal ScreenCast → PipeWire (needs libpipewire-0.3-dev + libclang; CI-verified)
pipewire = []
# Windows: Windows.Graphics.Capture
wgc = []
# macOS: ScreenCaptureKit
sckit = []

[lints]
workspace = true
