[package]
name = "tornect"
description = "Tornect — remote desktop over Tor onion services: no servers, no accounts, no port forwarding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tornect"
path = "src/main.rs"

[dependencies]
# `keyring`: the OS keychain for remembered unattended passwords (§B.8.9.1).
tornect-core = { workspace = true, features = ["keyring"] }
tornect-signal.workspace = true
tornect-platform.workspace = true
tornect-session.workspace = true
# The machine the direct path runs on (`RealNet`) and its candidate kinds
# (design `direct` §8.6); the sockets themselves stay inside it.
tornect-net.workspace = true
tornect-proto.workspace = true
tornect-capture.workspace = true
tornect-codec.workspace = true
tornect-input.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
zeroize.workspace = true
data-encoding.workspace = true
# The GUI (`tornect` with no subcommand; docs/research/slice.md §2, D10's
# egui-everywhere fallback): a manual winit loop driving egui-winit + egui-wgpu.
winit.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
pollster.workspace = true
qrcode.workspace = true
# The stream window's screenshot: a PNG with no metadata chunk.
png.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# wgpu backends per target (a target with no backend panics in `Instance::new`).
[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }

[target.'cfg(windows)'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }

[dev-dependencies]
tempfile.workspace = true
# Paused-clock runtimes (`start_paused`) in the host and terminal tests; without
# it `cargo test -p tornect` alone does not compile (feature unification hid it).
tokio = { workspace = true, features = ["test-util"] }
# A capturing subscriber: no device words in any trace (§B.6.1 W-B4).
tracing-subscriber.workspace = true
ed25519-dalek.workspace = true
# `MemNet`, the in-memory network of the direct-path tests (never in a
# release build: dev-dependency features do not reach it).
tornect-net = { workspace = true, features = ["test-support"] }

# The SIGTERM test signals its own process with kill(2): spawning `kill` would
# fork, and a forked child holds a copy of every open file, the other tests'
# store locks included, until it execs.
[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }

[lints]
workspace = true
