# cargo-deny configuration (run: cargo deny check --workspace). Tornect is
# GPL-3.0-or-later; every dependency license below is GPLv3-compatible.
# Delta vs the M0 draft per docs/research/ci.md §7.3 / docs/research/SUMMARY.md §1.9.

[graph]
all-features = false
# The OS-keychain backend is optional but ships (SLICE-A3 F3).
features = ["tornect-core/keyring"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  # The Windows build that ships (decision M3-1); msvc stays for CI.
  "x86_64-pc-windows-gnullvm",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # rsa 0.9 Marvin timing side channel. rsa is a direct dependency of tor-llcrypto and
  # tor-key-forge, and Arti does verify RSA signatures on network input (authority certs,
  # consensus, router descriptors). Marvin needs the victim to perform RSA *private-key*
  # operations, which Tornect's client and onion-service roles never do. No fixed version
  # exists; re-check whenever Arti changes how it uses RSA (SLICE-A3 A1).
  { id = "RUSTSEC-2023-0071", reason = "direct dep of tor-llcrypto/tor-key-forge; Tornect only verifies RSA signatures (public key), never performs the private-key operations Marvin needs" },
  # `paste` is unmaintained; pulled transitively by dependencies at build time only.
  { id = "RUSTSEC-2024-0436", reason = "proc-macro helper used at build time by transitive dependencies; no runtime exposure" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "BSL-1.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
  "OpenSSL",
  "CDLA-Permissive-2.0",
  "LGPL-2.1",
  "LGPL-2.1-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "GPL-3.0",
  "GPL-3.0-or-later",
  # minicbor / minicbor-derive (the §B.3 CBOR envelope, decision M1-7): the Blue
  # Oak Model License 1.0.0 is a permissive, attribution-free license (notice
  # preservation only), compatible with distribution under GPL-3.0-or-later.
  "BlueOak-1.0.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates are `path` dependencies without a version (they are
# `publish = false`); cargo-deny 0.20 otherwise reports each as a wildcard.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
