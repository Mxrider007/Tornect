# cargo-deny configuration (run: cargo deny check --workspace). Tornect is
# GPL-3.0-or-later; every dependency license below is GPLv3-compatible.
# Delta vs the M0 draft per docs/research/ci.md §7.3 / docs/research/SUMMARY.md §1.9.

[graph]
all-features = false
# The OS-keychain backend is optional but ships (SLICE-A3 F3).
features = ["tornect-core/keyring"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  # The Windows build that ships (decision M3-1); msvc stays for CI.
  "x86_64-pc-windows-gnullvm",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # rsa 0.9 Marvin timing side channel. rsa is a direct dependency of tor-llcrypto and
  # tor-key-forge, and Arti does verify RSA signatures on network input (authority certs,
  # consensus, router descriptors). Marvin needs the victim to perform RSA *private-key*
  # operations, which Tornect's client and onion-service roles never do. No fixed version
  # exists; re-check whenever Arti changes how it uses RSA (SLICE-A3 A1).
  { id = "RUSTSEC-2023-0071", reason = "direct dep of tor-llcrypto/tor-key-forge; Tornect only verifies RSA signatures (public key), never performs the private-key operations Marvin needs" },
  # `paste` is unmaintained; pulled transitively by dependencies at build time only.
  { id = "RUSTSEC-2024-0436", reason = "proc-macro helper used at build time by transitive dependencies; no runtime exposure" },
  # `ttf-parser` is unmaintained, with no fixed version. The window pulls it only
  # through winit's GNOME client-side decorations (`wayland-csd-adwaita`, the
  # slice.md §0 pin: sctk-adwaita -> ab_glyph -> owned_ttf_parser), which draw
  # the title bar's text from a local system font. No peer-supplied data reaches
  # it; egui's own text uses skrifa. Dropping it means `wayland-csd-adwaita-notitle`.
  { id = "RUSTSEC-2026-0192", reason = "reached only by winit's GNOME title-bar drawing of a local system font; no peer input" },
  # zbus 6 absorbed `zbus_names`, `zvariant` and `zvariant_derive`, so their
  # standalone crates are marked unmaintained, with no fixed version. They come in
  # through zbus 5: ashpd 0.13.13 (the latest ashpd, the portal client of the
  # Wayland capture and the platform crate) requires it, and tornect-platform
  # shares that one zbus for its own D-Bus calls. Drop these three once ashpd
  # moves to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; reached through zbus 5, which ashpd 0.13.13 (latest) requires; no advisory against its code" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; reached through zbus 5, which ashpd 0.13.13 (latest) requires; no advisory against its code" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; a build-time proc macro of zbus 5, which ashpd 0.13.13 (latest) requires" },
  # crypto-bigint 0.5 has timing variability in subtraction, zero counting, division
  # and Montgomery multiplication, fixed only in 0.7.6. It is built only as a
  # dependency of elliptic-curve 0.13, which opaque-ke 4.0.1 and voprf 0.5.0 require;
  # no release of either moves to elliptic-curve 0.14. With the ristretto255 suite
  # (`TornectOpaque`, tornect-signal's auth.rs) the only elliptic-curve code that runs
  # is expand_message_xmd (SHA-512 and XOR), and every scalar and point operation is
  # curve25519-dalek's, so no crypto-bigint function is called or linked (security
  # review of 2026-10-31). `[bans]` keeps both crates to those dependents. Drop this
  # once opaque-ke and voprf move to elliptic-curve 0.14; re-check whenever the OPAQUE
  # suite or opaque-ke's features change.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 is reached only through elliptic-curve 0.13 under opaque-ke/voprf; with the ristretto255 suite no crypto-bigint code is called or linked" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "BSL-1.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
  "OpenSSL",
  "CDLA-Permissive-2.0",
  "LGPL-2.1",
  "LGPL-2.1-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "GPL-3.0",
  "GPL-3.0-or-later",
  # minicbor / minicbor-derive (the §B.3 CBOR envelope, decision M1-7): the Blue
  # Oak Model License 1.0.0 is a permissive, attribution-free license (notice
  # preservation only), compatible with distribution under GPL-3.0-or-later.
  "BlueOak-1.0.0",
]
confidence-threshold = 0.8
# egui's bundled fonts (`epaint_default_fonts`: Ubuntu-Light, Hack, Noto Emoji,
# emoji-icon-font), compiled into the window as data. OFL-1.1 (OSI, FSF free)
# and the Ubuntu Font Licence 1.0 (free; redistribution with software allowed)
# cover those font files only, not Tornect's code.
exceptions = [
  { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates are `path` dependencies without a version (they are
# `publish = false`); cargo-deny 0.20 otherwise reports each as a wildcard.
allow-wildcard-paths = true
highlight = "all"
# The precondition of RUSTSEC-2026-0387's ignore: only opaque-ke and voprf depend on
# elliptic-curve, and only elliptic-curve depends on crypto-bigint. Another dependent
# (a NIST-curve crate such as p256, through an Arti feature) would bring crypto-bigint
# arithmetic on secret scalars into the build, and fails this check.
deny = [
  { crate = "elliptic-curve", wrappers = ["opaque-ke", "voprf"], reason = "RUSTSEC-2026-0387's ignore holds only while opaque-ke and voprf are its sole dependents" },
  { crate = "crypto-bigint", wrappers = ["elliptic-curve"], reason = "RUSTSEC-2026-0387's ignore holds only while elliptic-curve is its sole dependent" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
