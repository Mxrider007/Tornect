[workspace]
resolver = "3"
members = [
  "crates/tornect-core",
  "crates/tornect-signal",
  "crates/tornect-net",
  "crates/tornect-proto",
  "crates/tornect-capture",
  "crates/tornect-codec",
  "crates/tornect-audio",
  "crates/tornect-input",
  "crates/tornect-session",
  "apps/tornect",
  "xtask",
]
# cargo-fuzz targets (nightly, libfuzzer) build with their own lock file:
# `cargo +nightly fuzz run <target>` from the repo root.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/Mxrider420z/Tornect"
homepage = "https://github.com/Mxrider420z/Tornect"
authors = ["Tornect contributors"]
publish = false

# Every external dependency is pinned here and justified in docs/DEPENDENCIES.md.
[workspace.dependencies]
tornect-core = { path = "crates/tornect-core" }
tornect-signal = { path = "crates/tornect-signal" }
tornect-net = { path = "crates/tornect-net" }
tornect-proto = { path = "crates/tornect-proto" }
tornect-capture = { path = "crates/tornect-capture" }
tornect-codec = { path = "crates/tornect-codec" }
tornect-audio = { path = "crates/tornect-audio" }
tornect-input = { path = "crates/tornect-input" }
tornect-session = { path = "crates/tornect-session" }

anyhow = "1.0.104"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2.5"
directories = "6.0.0"
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
sha2 = "0.11.0"
sha3 = "0.11"
hmac = "0.13.0"
hkdf = "0.13.0"
data-encoding = "2.11.1"
zeroize = { version = "1.9.0", features = ["derive"] }
getrandom = { version = "0.4.3", features = ["std", "sys_rng"] }
subtle = "2.6.1"
hex = "0.4.3"
fs-err = "3.3.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
bytes = "1.12.1"
parking_lot = "0.12.5"
tempfile = "3.27.0"
proptest = "1.11.0"

# Milestone 1 — Arti (Tor) embedding. Every tor-* crate must share one exact
# version (docs/research/arti.md §1); never enable arti-client `full`,
# `experimental`, `native-tls` or `static` (§2). rustls stays on the `ring`
# provider, shared with quinn (docs/research/quic.md §1.2–§2).
arti-client = { version = "=0.45.0", default-features = false, features = [
  "tokio", "rustls", "compression", "flowctl-cc", "static-sqlite",
  "onion-service-service", "onion-service-client", "vanguards",
] }
tor-hsservice = "=0.45.0"
tor-hscrypto = "=0.45.0"
tor-cell = "=0.45.0"
tor-proto = "=0.45.0"
# `state-dir` (experimental marker, already compiled in via tor-hsservice) gives
# `StateDirectory::acquire_instance` + `InstanceStateHandle::purge`: taking the
# lock a running service holds, then deleting its `hss/<nickname>/` state and
# lock file when an identity is rotated (decision M1-6).
tor-persist = { version = "=0.45.0", features = ["state-dir"] }
tor-llcrypto = "=0.45.0"
tor-keymgr = { version = "=0.45.0", features = ["keymgr"] }
tor-rtcompat = { version = "=0.45.0", features = ["tokio", "rustls"] }
safelog = "0.9"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
futures = "0.3.34"

# Milestone 1 — signaling protocol, pairing, unattended access (docs/PLAN.md §B.3,
# §B.8; pins per docs/research/crypto.md §0/§8 and docs/research/SUMMARY.md §1.2).
# CBOR: minicbor with derive (integer keys, unknown keys skipped — schema-evolvable);
# signatures cover the exact wire bytes, so no canonical encoding is needed.
minicbor = { version = "=2.3.0", features = ["std", "derive"] }
# AEAD for the encrypted unattended store (XChaCha20-Poly1305, RustCrypto 2026 line).
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
# OPAQUE-3DH (ristretto255 / SHA-512 / Argon2id KSF). Still on the old crypto stack
# (rand 0.8, digest 0.10, argon2 0.5): the KE hash must be `sha2_010::Sha512`, the KSF
# type `opaque_ke::argon2::Argon2`, and RNGs go through a rand_core-0.6 adapter.
opaque-ke = { version = "=4.0.1", default-features = false, features = ["argon2", "ristretto255", "serde"] }
sha2_010 = { package = "sha2", version = "0.10" }
rand_core_06 = { package = "rand_core", version = "0.6" }
rand = "=0.10.2"
rand_core = "=0.10.1"
# Password policy (§B.8.7.2): NFC normalization + zxcvbn scoring on the client/CLI side.
unicode-normalization = "=0.1.25"
zxcvbn = "=3.1.1"
# OS keychain for K_master (§B.8.9), behind the `keyring` feature; file keystore is the fallback.
keyring-core = "=1.0.0"
linux-keyutils-keyring-store = "=1.0.0"
# Fuzzing helpers (fuzz/ crate is workspace-excluded; `arbitrary` derives shared with it).
arbitrary = { version = "=1.4.2", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "warn"
rust_2018_idioms = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
opt-level = 1

# Crypto, codecs and Tor are unusably slow unoptimized; optimize dependencies even in dev.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dist]
inherits = "release"
lto = "fat"
strip = "symbols"
