[workspace]
resolver = "3"
members = [
  "crates/tornect-core",
  "crates/tornect-signal",
  "crates/tornect-net",
  "crates/tornect-proto",
  "crates/tornect-capture",
  "crates/tornect-codec",
  "crates/tornect-audio",
  "crates/tornect-input",
  "crates/tornect-session",
  "crates/tornect-platform",
  "apps/tornect",
  "xtask",
]
# cargo-fuzz targets (nightly, libfuzzer) build with their own lock file:
# `cargo +nightly fuzz run <target>` from the repo root.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/Mxrider420z/Tornect"
homepage = "https://github.com/Mxrider420z/Tornect"
authors = ["Tornect contributors"]
publish = false

# Every external dependency is pinned here and justified in docs/DEPENDENCIES.md.
[workspace.dependencies]
tornect-core = { path = "crates/tornect-core" }
tornect-signal = { path = "crates/tornect-signal" }
tornect-net = { path = "crates/tornect-net" }
tornect-proto = { path = "crates/tornect-proto" }
tornect-capture = { path = "crates/tornect-capture" }
tornect-codec = { path = "crates/tornect-codec" }
tornect-audio = { path = "crates/tornect-audio" }
tornect-input = { path = "crates/tornect-input" }
tornect-session = { path = "crates/tornect-session" }
tornect-platform = { path = "crates/tornect-platform" }

anyhow = "1.0.104"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2.5"
directories = "6.0.0"
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
sha2 = "0.11.0"
sha3 = "0.11"
hmac = "0.13.0"
hkdf = "0.13.0"
data-encoding = "2.11.1"
zeroize = { version = "1.9.0", features = ["derive"] }
getrandom = { version = "0.4.3", features = ["std", "sys_rng"] }
subtle = "2.6.1"
hex = "0.4.3"
fs-err = "3.3.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
bytes = "1.12.1"
parking_lot = "0.12.5"
tempfile = "3.27.0"
proptest = "1.11.0"

# Milestone 1 — Arti (Tor) embedding. Every tor-* crate must share one exact
# version (docs/research/arti.md §1); never enable arti-client `full`,
# `experimental`, `native-tls` or `static` (§2). rustls stays on the `ring`
# provider, shared with quinn (docs/research/quic.md §1.2–§2).
# `pt-client` (implies `bridge-client`; adds tor-ptmgr 0.45.0, not experimental):
# obfs4 and Snowflake bridges through the bundled `lyrebird`, decision M1-38
# (docs/research/bridges.md §1.2).
arti-client = { version = "=0.45.0", default-features = false, features = [
  "tokio", "rustls", "compression", "flowctl-cc", "static-sqlite",
  "onion-service-service", "onion-service-client", "vanguards", "pt-client",
] }
tor-hsservice = "=0.45.0"
tor-hscrypto = "=0.45.0"
tor-cell = "=0.45.0"
tor-proto = "=0.45.0"
# `state-dir` (experimental marker, already compiled in via tor-hsservice) gives
# `StateDirectory::acquire_instance` + `InstanceStateHandle::purge`: taking the
# lock a running service holds, then deleting its `hss/<nickname>/` state and
# lock file when an identity is rotated (decision M1-6).
tor-persist = { version = "=0.45.0", features = ["state-dir"] }
tor-llcrypto = "=0.45.0"
tor-keymgr = { version = "=0.45.0", features = ["keymgr"] }
tor-rtcompat = { version = "=0.45.0", features = ["tokio", "rustls"] }
safelog = "0.9"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
futures = "0.3.34"

# Milestone 1 — signaling protocol, pairing, unattended access (docs/PLAN.md §B.3,
# §B.8; pins per docs/research/crypto.md §0/§8 and docs/research/SUMMARY.md §1.2).
# CBOR: minicbor with derive (integer keys, unknown keys skipped — schema-evolvable);
# signatures cover the exact wire bytes, so no canonical encoding is needed.
minicbor = { version = "=2.3.0", features = ["std", "derive"] }
# AEAD for the encrypted unattended store (XChaCha20-Poly1305, RustCrypto 2026 line).
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
# OPAQUE-3DH (ristretto255 / SHA-512 / Argon2id KSF). Still on the old crypto stack
# (rand 0.8, digest 0.10, argon2 0.5): the KE hash must be `sha2_010::Sha512`, the KSF
# type `opaque_ke::argon2::Argon2`, and RNGs go through a rand_core-0.6 adapter.
opaque-ke = { version = "=4.0.1", default-features = false, features = ["argon2", "ristretto255", "serde"] }
sha2_010 = { package = "sha2", version = "0.10" }
rand_core_06 = { package = "rand_core", version = "0.6" }
rand = "=0.10.2"
rand_core = "=0.10.1"
# Password policy (§B.8.7.2): NFC normalization + zxcvbn scoring on the client/CLI side.
unicode-normalization = "=0.1.25"
zxcvbn = "=3.1.1"
# OS keychain for K_master (§B.8.9), behind the `keyring` feature; file keystore is the fallback.
keyring-core = "=1.0.0"
linux-keyutils-keyring-store = "=1.0.0"
# Milestone 1 — Linux OS re-authentication (§B.8.6.2, §B.8.8, §B.8.14). Pure-Rust
# D-Bus client for polkit's `CheckAuthorization`: no libdbus, and no PAM headers
# because polkit runs the PAM conversation out of process in its setuid
# `polkit-agent-helper-1`. `async-io` off so the process keeps one runtime;
# `blocking-api` off because `zbus::blocking` would spin up a second private
# tokio runtime. Linux-only; `tornect-platform` gates it per target.
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
# Echo-off password prompt for `tornect unattended grant|set-password`
# (§B.8.7.4: "passwords via TTY prompt, never argv"). Already in the tree as a
# transitive dependency at this exact version; taking it as a direct one adds no
# new crate and keeps `apps/tornect` free of `libc` and of `unsafe`.
rustix = { version = "=1.1.4", default-features = false, features = ["std", "termios", "stdio"] }

# Fuzzing helpers (fuzz/ crate is workspace-excluded; `arbitrary` derives shared with it).
arbitrary = { version = "=1.4.2", features = ["derive"] }

# Vertical slice (operator ruling 2026-09-21; decisions M1-39 and M3-1): pins
# verified by research_verifier against crates.io and the crate sources
# (docs/research/slice.md). UI = the D10 egui-everywhere fallback: a manual
# winit loop driving egui-winit + egui-wgpu, never eframe (physical scancodes).
winit = "=0.30.13"
egui = "=0.36.2"
egui-winit = { version = "=0.36.2", default-features = false, features = ["clipboard", "wayland", "x11"] }
# `default-features = false`: the defaults turn on every wgpu backend + webgl.
egui-wgpu = { version = "=0.36.2", default-features = false, features = ["winit", "wayland", "x11"] }
# Backends are added per target in the member crate (Linux vulkan+gles, Windows dx12).
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "parking_lot"] }
pollster = "=1.0.1"
# Cisco OpenH264 built from source with `cc` (C++; nasm optional, no cmake) — M0-5.
openh264 = { version = "=0.9.8", default-features = false, features = ["source"] }
# Linux host: RemoteDesktop/ScreenCast portals (pure Rust over zbus/tokio),
# PipeWire through dlopen (no headers on the dev VM), X11 fallback.
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "screencast", "remote_desktop"] }
libloading = "=0.8.9"
x11rb = { version = "=0.13.2", default-features = false, features = ["xtest", "xfixes"] }
# Windows host: GDI capture + SendInput (plain Win32, no COM); tornect-platform's
# start-at-logon task (`schtasks.exe` from the system directory, the user's SID,
# `ShellExecuteExW` "runas" for the opt-in elevated task) and OS re-authentication
# (`CredUIPromptForWindowsCredentialsW` on the secure desktop, then `LogonUserW`).
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell"] }

[workspace.lints.rust]
unsafe_code = "warn"
rust_2018_idioms = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
opt-level = 1

# Crypto, codecs and Tor are unusably slow unoptimized; optimize dependencies even in dev.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dist]
inherits = "release"
lto = "fat"
strip = "symbols"
