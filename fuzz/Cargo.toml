[package]
name = "tornect-fuzz"
version = "0.0.0"
description = "cargo-fuzz targets for Tornect's wire parsers (docs/PLAN.md §D.5)"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
# `tor-pow` (equix/hashx JIT) is irrelevant to the parsers and slow to build.
tornect-signal = { path = "../crates/tornect-signal", default-features = false }
tornect-core = { path = "../crates/tornect-core" }
# The media stream's frames (`media` target); pure Rust, no codec.
tornect-proto = { path = "../crates/tornect-proto" }
tokio = { version = "1.53.1", features = ["rt", "io-util", "test-util", "time"] }
# Structure-aware inputs for the F3 store / limiter loaders (pinned in the workspace table too).
arbitrary = "=1.4.2"
minicbor = "=2.3.0"
zeroize = "1.9.0"

# Length-prefixed frames (`tornect_signal::framing::read_frame`), the first
# wire-parsed input of the signaling crate. The CBOR envelope target extends it.
[[bin]]
name = "framing"
path = "fuzz_targets/framing.rs"
test = false
doc = false
bench = false

# F1 (docs/PLAN.md §B.8.15): the CBOR envelope, every message body and both
# handshake FSMs fed with arbitrary frames.
[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

# F3 (docs/PLAN.md §B.8.15): the unattended store + limiter loaders through the `Clock`
# trait with fuzzed wall / monotonic readings (tornect-core, no networking).
[[bin]]
name = "store"
path = "fuzz_targets/store.rs"
test = false
doc = false
bench = false

# F4 (docs/PLAN.md §B.8.7.4): the IPC message codec of `tornect-core::unattended::ipc`.
[[bin]]
name = "ipc"
path = "fuzz_targets/ipc.rs"
test = false
doc = false
bench = false

# Invitation links (design `invite` §4.1–§4.2): `tornect-core::invite::{parse_link, find_id}`
# and `TornectId::from_str` over arbitrary text; seeds in `seeds/invite/`.
[[bin]]
name = "invite"
path = "fuzz_targets/invite.rs"
test = false
doc = false
bench = false

# The Tor media stream's frames (decision M1-39, the quality design's §4 messages,
# the monitors design's §3 messages, decision M1-75):
# `tornect_proto::Msg::decode` and `read_msg_max` at both caps; seeds in `seeds/media/`.
[[bin]]
name = "media"
path = "fuzz_targets/media.rs"
test = false
doc = false
bench = false

# The direct-path signaling bodies (design `direct` §6.1, decision M1-80):
# `CANDIDATES`, `TOR_FALLBACK` and `CANDIDATES_DONE` through `decode_body`;
# seeds in `seeds/candidates/`.
[[bin]]
name = "candidates"
path = "fuzz_targets/candidates.rs"
test = false
doc = false
bench = false

# The session services stream (decision M1-76, the services design §3):
# `tornect_proto::services` decode, the gated reader of both sides and the
# fixed-size bind read; seeds in `seeds/services/`.
[[bin]]
name = "services"
path = "fuzz_targets/services.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
